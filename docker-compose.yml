services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expoaprendizaje-web
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    environment:
      - TZ=America/Bogota
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
