<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070714">
  <title>EXPOAPRENDIZAJE - RETRO ARCADE 80s</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/movil.css?v=2">
</head>
<body>

  <!-- Capa de pantalla CRT (Scanlines + Viñeta) -->
  <div class="crt-overlay" aria-hidden="true"></div>

  <!-- Barra de controles superior -->
  <header class="top-controls">
    <button type="button" class="btn-icon-arcade" id="btn-toggle-sonido" title="Silenciar / Activar Sonido" aria-label="Sonido">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <button type="button" class="btn-icon-arcade" id="btn-toggle-fullscreen" title="Pantalla Completa" aria-label="Pantalla completa">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </header>

  <!-- ========================================================================
       1. PANTALLA DE INICIO ARCADE (PRESS START)
       ======================================================================== -->
  <main class="pantalla activa" id="pantalla-inicio">
    <div class="hero-content">
      <div class="arcade-badge" id="label-feria">[ EXPOAPRENDIZAJE ]</div>

      <h1 class="hero-title" id="label-titulo">RETRO ARCADE</h1>

      <p class="hero-subtitle" id="label-subtitulo">
        SELECCIONA UN JUEGO PARA EMPEZAR A COMPETIR
      </p>

      <button type="button" class="btn-arcade btn-press-start blink-text" id="btn-press-start">
        > PRESS START &lt;
      </button>

      <div class="hero-credits" id="label-creditos">
        INSERT COIN / CRÉDITOS: 99
      </div>
    </div>
  </main>

  <!-- ========================================================================
       2. PANTALLA DE SELECCIÓN DE JUEGOS
       ======================================================================== -->
  <section class="pantalla oculta" id="pantalla-seleccion" aria-label="Selección de juegos">
    <div class="selection-container">
      
      <div class="selection-header">
        <div>
          <h2 class="selection-title">ELIGE TU JUEGO</h2>
          <p class="selection-subtitle">TOCA UNA TARJETA PARA INICIAR LA PARTIDA</p>
        </div>

        <button type="button" class="btn-arcade btn-arcade-cyan" id="btn-volver-inicio">
          &lt; VOLVER
        </button>
      </div>

      <!-- Cuadrícula dinámica de tarjetas -->
      <div class="games-grid" id="contenedor-juegos">
        <!-- Renderizado dinámico desde js/menu.js -->
      </div>

    </div>
  </section>

  <!-- Scripts modulares compartidos -->
  <script src="js/sonidos.js?v=2"></script>
  <script src="js/transiciones.js"></script>
  <script src="js/movil.js?v=2"></script>
  <script src="js/menu.js"></script>
</body>
</html>
