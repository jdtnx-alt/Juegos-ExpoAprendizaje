<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070714">
  <title>Duelo Sumo 2P - Retro Arcade</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/movil.css?v=3">
  <style>
    .sumo-canvas-wrap {
      width: min(96vw, 840px);
      aspect-ratio: 850 / 520;
      max-height: calc(100vh - 195px);
      position: relative;
      background: #000;
      border: 4px solid var(--neon-yellow);
      box-shadow: 0 0 25px var(--neon-yellow-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #sumo-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .key-indicator-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 12px;
      width: 100%;
      max-width: 840px;
      margin-top: 8px;
      font-size: clamp(0.55rem, 1.2vw, 0.72rem);
      line-height: 1.6;
      min-height: 28px;
    }
  </style>
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>

  <header class="top-controls">
    <button type="button" class="btn-icon-arcade" id="btn-toggle-sonido" title="Sonido">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
  </header>

  <main class="game-container">
    <div class="game-top-bar">
      <button type="button" class="btn-arcade btn-arcade-cyan" id="btn-back-menu" style="padding: 8px 14px; font-size: 0.65rem;">
        &lt; MENÚ
      </button>

      <div class="game-stats">
        <div class="stat-item" style="color: var(--neon-cyan);">J1 RONDAS: <span id="rondas-p1">0</span></div>
        <div class="stat-item" style="color: var(--neon-yellow);">MEJOR DE 3</div>
        <div class="stat-item" style="color: var(--neon-magenta);">J2 RONDAS: <span id="rondas-p2">0</span></div>
      </div>
    </div>

    <div class="arcade-screen" style="padding: 10px;">
      <!-- Overlay de Inicio -->
      <div class="game-start-overlay" id="overlay-start">
        <div class="start-icon" style="margin-bottom: 8px;">
          <svg width="60" height="60" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="26" stroke="#ffe600" stroke-width="4" fill="#0d0b21"/>
            <circle cx="22" cy="32" r="10" fill="#00f0ff"/>
            <circle cx="42" cy="32" r="10" fill="#ff007f"/>
          </svg>
        </div>
        <h1 class="game-title-big">DUELO SUMO 2P</h1>
        <p class="game-instructions">
          J1: <b>[W A S D]</b> | J2: <b>[FLECHAS]</b>. ¡ACELERA CON INERCIA, EMBISTE AL RIVAL Y SÁCALO DEL RING CIRCULAR!
        </p>
        <button type="button" class="btn-arcade btn-arcade-green blink-text" id="btn-start-sumo" style="margin-top: 10px;">
          > START
        </button>
      </div>

      <div class="sumo-canvas-wrap">
        <canvas id="sumo-canvas" width="850" height="520"></canvas>
      </div>

      <!-- Controles táctiles en pantalla para móvil (J1 izquierda, J2 derecha) -->
      <div class="arcade-touch-layer dual-touch-overlay" id="touch-controls">
        <div class="side-p1" id="joystick-j1-container"></div>
        <div class="side-p2" id="joystick-j2-container"></div>
      </div>

      <div class="key-indicator-bar">
        <span style="color: var(--neon-cyan);">J1 (AZUL): [W A S D] MOVER CON INERCIA</span>
        <span style="color: var(--neon-magenta);">J2 (ROSA): [FLECHAS] MOVER CON INERCIA</span>
      </div>
    </div>
  </main>

  <script src="../js/sonidos.js?v=3"></script>
  <script src="../js/transiciones.js"></script>
  <script src="../js/movil.js?v=3"></script>

  <script>
    /* ==========================================================================
       CONSTANTES CONFIGURABLES DEL DUELO SUMO
       ========================================================================== */
    const RONDAS_PARA_GANAR = 2;              // Mejor de 3 rondas (primero a 2)
    const RADIO_RING = 240;                   // Tamaño ampliado del ring circular central
    const RADIO_LUCHADOR = 28;                // Radio de los sumos
    const ACELERACION = 0.28;                 // Rapidez de aceleración
    const VELOCIDAD_MAX = 4.5;                // Límite de velocidad
    const FRICCION = 0.955;                   // Inercia de deslizamiento sobre el ring
    const FUERZA_EMPUJE = 2.1;                // Fuerza de empuje aumentada (multiplicada para que los choques se sientan contundentes)

    const canvas = document.getElementById('sumo-canvas');
    const ctx = canvas.getContext('2d');

    const rondasP1El = document.getElementById('rondas-p1');
    const rondasP2El = document.getElementById('rondas-p2');
    const overlayStart = document.getElementById('overlay-start');
    const btnStart = document.getElementById('btn-start-sumo');
    const btnBackMenu = document.getElementById('btn-back-menu');

    const W = 850;
    const H = 520;
    const CENTRO_X = W / 2;
    const CENTRO_Y = H / 2;

    let rondasP1 = 0;
    let rondasP2 = 0;
    let jugando = false;
    let loopId = null;
    let sacudida = 0;
    let particulas = [];
    let pausaEntreRondas = false;

    // Luchador 1 (Cyan)
    const j1 = {
      x: CENTRO_X - 125,
      y: CENTRO_Y,
      vx: 0,
      vy: 0,
      color: '#00f0ff',
      cara: 'O_O',
      fuera: false
    };

    // Luchador 2 (Magenta)
    const j2 = {
      x: CENTRO_X + 125,
      y: CENTRO_Y,
      vx: 0,
      vy: 0,
      color: '#ff007f',
      cara: '>_<',
      fuera: false
    };

    const teclas = {};
    window.addEventListener('keydown', (e) => {
      teclas[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      teclas[e.code] = false;
    });

    // Joysticks virtuales para dispositivos táctiles (solo en pantallas táctiles reales)
    let joyVecJ1 = { x: 0, y: 0 };
    let joyVecJ2 = { x: 0, y: 0 };

    const esTactilSumo = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    if (typeof RetroMovil !== 'undefined' && esTactilSumo) {
      // Guardia de orientación (requiere horizontal en móvil)
      new RetroMovil.OrientationGuard('landscape');

      new RetroMovil.VirtualJoystick('#joystick-j1-container', {
        color: '#00f0ff',
        onMove: (v) => { joyVecJ1 = v; }
      });

      new RetroMovil.VirtualJoystick('#joystick-j2-container', {
        color: '#ff007f',
        onMove: (v) => { joyVecJ2 = v; }
      });
    }

    btnBackMenu.addEventListener('click', () => {
      transicion.irA('../index.html');
    });

    btnStart.addEventListener('click', () => {
      transicion.iniciarCarga(() => {
        overlayStart.classList.add('oculto');
        iniciarPartida();
      });
    });

    function iniciarPartida() {
      rondasP1 = 0;
      rondasP2 = 0;
      rondasP1El.textContent = '0';
      rondasP2El.textContent = '0';
      resetRonda();
      jugando = true;

      if (loopId) cancelAnimationFrame(loopId);
      bucle();
    }

    function resetRonda() {
      j1.x = CENTRO_X - 125;
      j1.y = CENTRO_Y;
      j1.vx = 0;
      j1.vy = 0;
      j1.fuera = false;

      j2.x = CENTRO_X + 125;
      j2.y = CENTRO_Y;
      j2.vx = 0;
      j2.vy = 0;
      j2.fuera = false;

      particulas = [];
      pausaEntreRondas = false;
    }

    function crearChispas(x, y, color) {
      for (let i = 0; i < 16; i++) {
        particulas.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 4 + 2,
          color: color,
          vida: 18
        });
      }
    }

    function bucle() {
      if (!jugando) return;

      if (!pausaEntreRondas) {
        // 1. Aceleración J1 (WASD o Joystick Táctil)
        if (teclas['KeyW']) j1.vy -= ACELERACION;
        if (teclas['KeyS']) j1.vy += ACELERACION;
        if (teclas['KeyA']) j1.vx -= ACELERACION;
        if (teclas['KeyD']) j1.vx += ACELERACION;
        if (joyVecJ1.x !== 0 || joyVecJ1.y !== 0) {
          j1.vx += joyVecJ1.x * ACELERACION * 1.4;
          j1.vy += joyVecJ1.y * ACELERACION * 1.4;
        }

        // 2. Aceleración J2 (Flechas o Joystick Táctil)
        if (teclas['ArrowUp']) j2.vy -= ACELERACION;
        if (teclas['ArrowDown']) j2.vy += ACELERACION;
        if (teclas['ArrowLeft']) j2.vx -= ACELERACION;
        if (teclas['ArrowRight']) j2.vx += ACELERACION;
        if (joyVecJ2.x !== 0 || joyVecJ2.y !== 0) {
          j2.vx += joyVecJ2.x * ACELERACION * 1.4;
          j2.vy += joyVecJ2.y * ACELERACION * 1.4;
        }

        // 3. Fricción e inercia
        j1.vx *= FRICCION;
        j1.vy *= FRICCION;
        j2.vx *= FRICCION;
        j2.vy *= FRICCION;

        // Limitar velocidad máxima
        const mag1 = Math.hypot(j1.vx, j1.vy);
        if (mag1 > VELOCIDAD_MAX) {
          j1.vx = (j1.vx / mag1) * VELOCIDAD_MAX;
          j1.vy = (j1.vy / mag1) * VELOCIDAD_MAX;
        }

        const mag2 = Math.hypot(j2.vx, j2.vy);
        if (mag2 > VELOCIDAD_MAX) {
          j2.vx = (j2.vx / mag2) * VELOCIDAD_MAX;
          j2.vy = (j2.vy / mag2) * VELOCIDAD_MAX;
        }

        // Mover
        j1.x += j1.vx;
        j1.y += j1.vy;
        j2.x += j2.vx;
        j2.y += j2.vy;

        // 4. Colisión elástica entre ambos luchadores
        const dx = j2.x - j1.x;
        const dy = j2.y - j1.y;
        const dist = Math.hypot(dx, dy);
        const radioSuma = RADIO_LUCHADOR * 2;

        if (dist < radioSuma && dist > 0) {
          if (typeof sonidos !== 'undefined') sonidos.golpe();
          sacudida = 8;

          const nx = dx / dist;
          const ny = dy / dist;

          // Separar para no solapar
          const overlap = radioSuma - dist;
          j1.x -= nx * (overlap / 2);
          j1.y -= ny * (overlap / 2);
          j2.x += nx * (overlap / 2);
          j2.y += ny * (overlap / 2);

          // Choque elástico de masas iguales
          const relVx = j1.vx - j2.vx;
          const relVy = j1.vy - j2.vy;
          const vn = relVx * nx + relVy * ny;

          if (vn > 0) {
            const impulso = vn * FUERZA_EMPUJE;
            j1.vx -= nx * impulso;
            j1.vy -= ny * impulso;
            j2.vx += nx * impulso;
            j2.vy += ny * impulso;

            crearChispas((j1.x + j2.x) / 2, (j1.y + j2.y) / 2, '#ffe600');
          }
        }

        // 5. Verificar si alguno salió del ring
        const distCentro1 = Math.hypot(j1.x - CENTRO_X, j1.y - CENTRO_Y);
        const distCentro2 = Math.hypot(j2.x - CENTRO_X, j2.y - CENTRO_Y);

        if (distCentro1 > RADIO_RING) {
          // J1 cae fuera -> punto para J2
          j1.fuera = true;
          pausaEntreRondas = true;
          rondasP2++;
          rondasP2El.textContent = rondasP2;
          if (typeof sonidos !== 'undefined') sonidos.punto();
          comprobarFinDePartida();
        } else if (distCentro2 > RADIO_RING) {
          // J2 cae fuera -> punto para J1
          j2.fuera = true;
          pausaEntreRondas = true;
          rondasP1++;
          rondasP1El.textContent = rondasP1;
          if (typeof sonidos !== 'undefined') sonidos.punto();
          comprobarFinDePartida();
        }
      }

      // Actualizar partículas
      for (let i = particulas.length - 1; i >= 0; i--) {
        const p = particulas[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vida--;
        if (p.vida <= 0) particulas.splice(i, 1);
      }

      dibujar();

      if (jugando) {
        loopId = requestAnimationFrame(bucle);
      }
    }

    function comprobarFinDePartida() {
      if (rondasP1 >= RONDAS_PARA_GANAR) {
        setTimeout(() => finalizarPartida(1), 800);
      } else if (rondasP2 >= RONDAS_PARA_GANAR) {
        setTimeout(() => finalizarPartida(2), 800);
      } else {
        // Siguiente ronda tras 1.2 segundos
        setTimeout(() => resetRonda(), 1200);
      }
    }

    function finalizarPartida(ganador) {
      jugando = false;
      if (typeof sonidos !== 'undefined') sonidos.victoria();

      transicion.mostrarVictoria({
        titulo: `¡JUGADOR ${ganador} GANA EL SUMO!`,
        lineasInfo: [
          { label: 'JUGADOR 1', valor: `${rondasP1} RONDAS` },
          { label: 'JUGADOR 2', valor: `${rondasP2} RONDAS` },
          { label: 'MODALIDAD', valor: 'AL MEJOR DE 3' }
        ],
        onReintentar: () => iniciarPartida(),
        urlMenu: '../index.html'
      });
    }

    function dibujarLuchador(l) {
      ctx.save();
      ctx.fillStyle = l.color;
      ctx.shadowColor = l.color;
      ctx.shadowBlur = l.fuera ? 0 : 14;

      // Cuerpo circular grande
      ctx.beginPath();
      ctx.arc(l.x, l.y, RADIO_LUCHADOR, 0, Math.PI * 2);
      ctx.fill();

      // Cinturón mawashi de sumo (negro con hebilla dorada)
      ctx.fillStyle = '#111';
      ctx.fillRect(l.x - RADIO_LUCHADOR + 4, l.y - 6, (RADIO_LUCHADOR * 2) - 8, 12);
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(l.x - 5, l.y - 6, 10, 12);

      // Ojos o cara pixelada
      ctx.fillStyle = '#000';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(l.cara, l.x, l.y - 14);

      ctx.restore();
    }

    function dibujar() {
      ctx.save();

      // Efecto sacudida al chocar
      if (sacudida > 0) {
        const sx = (Math.random() - 0.5) * sacudida;
        const sy = (Math.random() - 0.5) * sacudida;
        ctx.translate(sx, sy);
        sacudida *= 0.82;
        if (sacudida < 0.4) sacudida = 0;
      }

      // Fondo abismo exterior
      ctx.fillStyle = '#060412';
      ctx.fillRect(0, 0, W, H);

      // Cuadrícula exterior
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // Ring circular tradicional (Dohyo retro)
      ctx.save();
      ctx.fillStyle = '#100e28';
      ctx.beginPath();
      ctx.arc(CENTRO_X, CENTRO_Y, RADIO_RING, 0, Math.PI * 2);
      ctx.fill();

      // Borde del Ring neón amarillo parpadeante sutil
      ctx.strokeStyle = '#ffe600';
      ctx.shadowColor = '#ffe600';
      ctx.shadowBlur = 15;
      ctx.lineWidth = 6;
      ctx.stroke();

      // Línea divisoria central del ring
      ctx.strokeStyle = 'rgba(255, 230, 0, 0.25)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(CENTRO_X, CENTRO_Y - RADIO_RING);
      ctx.lineTo(CENTRO_X, CENTRO_Y + RADIO_RING);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // Partículas
      particulas.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });

      // Luchadores
      dibujarLuchador(j1);
      dibujarLuchador(j2);

      ctx.restore();
    }

    dibujar();
  </script>
</body>
</html>
